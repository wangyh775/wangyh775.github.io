<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40"/>
    </pattern>
    <rect width="800" height="450" fill="url(#grid)"/>
  </g>
  <circle cx="150" cy="100" r="100" fill="#3b82f6" opacity="0.12" filter="url(#glow)"/>
  <circle cx="650" cy="350" r="120" fill="#8b5cf6" opacity="0.12" filter="url(#glow)"/>

  <text x="40" y="55" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" letter-spacing="0.5">
    Sim2Real <tspan fill="#38bdf8" font-weight="400">仿真到实物验证流程</tspan>
  </text>
  <text x="40" y="80" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
    CFD/FEA 仿真 · 实验验证 · 参数优化迭代
  </text>

  <g transform="translate(40, 115)">
    <rect width="220" height="115" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <rect width="220" height="32" rx="10" fill="#1e293b" opacity="0.8"/>
    <text x="12" y="22" fill="#38bdf8" font-family="sans-serif" font-weight="700" font-size="12">🖥️ 仿真建模 (Sim)</text>
    <text x="15" y="52" fill="#e2e8f0" font-family="sans-serif" font-size="10">ANSYS Fluent / COMSOL</text>
    <text x="15" y="72" fill="#94a3b8" font-family="sans-serif" font-size="9">流热耦合多物理场仿真</text>
    <text x="15" y="92" fill="#64748b" font-family="sans-serif" font-size="9">预测温度/压力/流场分布</text>
  </g>
  <path d="M 260 172 L 285 172" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="272" cy="172" r="4" fill="#38bdf8"/>

  <g transform="translate(290, 115)">
    <rect width="220" height="115" rx="10" fill="url(#cardGrad)" stroke="#4338ca" stroke-width="1.5"/>
    <rect width="220" height="32" rx="10" fill="#1e1b4b" opacity="0.8"/>
    <text x="12" y="22" fill="#a5b4fc" font-family="sans-serif" font-weight="700" font-size="12">🔬 实验验证 (Real)</text>
    <text x="15" y="52" fill="#e2e8f0" font-family="sans-serif" font-size="10">高温 FDM 3D 打印机测试</text>
    <text x="15" y="72" fill="#94a3b8" font-family="sans-serif" font-size="9">温度/推力/流量实测</text>
    <text x="15" y="92" fill="#64748b" font-family="sans-serif" font-size="9">打印样件质量检验</text>
  </g>
  <path d="M 510 172 L 535 172" stroke="#818cf8" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="522" cy="172" r="4" fill="#818cf8"/>

  <g transform="translate(540, 115)">
    <rect width="220" height="115" rx="10" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-width="1.5" filter="url(#glow)"/>
    <rect width="220" height="32" rx="10" fill="#2e1065" opacity="0.8"/>
    <text x="12" y="22" fill="#c084fc" font-family="sans-serif" font-weight="700" font-size="12">🔄 参数迭代优化</text>
    <text x="15" y="50" fill="#e2e8f0" font-family="sans-serif" font-size="10">仿真 vs 实测误差分析</text>
    <text x="15" y="70" fill="#94a3b8" font-family="sans-serif" font-size="9">模型参数修正</text>
    <text x="15" y="90" fill="#64748b" font-family="sans-serif" font-size="9">结构/工艺优化迭代</text>
  </g>

  <!-- 反馈箭头：从参数迭代优化底部 → 实验验证底部 -->
  <path d="M 540 230 L 510 230" stroke="#059669" stroke-width="2" fill="none" stroke-dasharray="5 5"/>
  <path d="M 530 226 L 522 230 L 530 234" fill="none" stroke="#059669" stroke-width="2"/>
  <text x="440" y="222" fill="#6ee7b7" font-family="sans-serif" font-size="10" font-weight="600">反馈迭代</text>

  <g transform="translate(40, 280)">
    <rect width="720" height="60" rx="10" fill="url(#cardGrad)" stroke="#059669" stroke-width="1.5"/>
    <text x="20" y="28" fill="#6ee7b7" font-family="sans-serif" font-weight="700" font-size="13">✅ 验证结果</text>
    <text x="20" y="50" fill="#e2e8f0" font-family="sans-serif" font-size="11">挤出推力仿真误差 &lt; 2% · 温度分布误差 &lt; 1.5% · 压降降低 22%</text>
  </g>

  <g transform="translate(40, 375)">
    <rect width="720" height="40" rx="8" fill="#1e293b" stroke="#334155" opacity="0.7"/>
    <text x="20" y="25" fill="#38bdf8" font-family="sans-serif" font-weight="600" font-size="11">Key Steps:</text>
    <rect x="100" y="10" width="85" height="20" rx="4" fill="#0284c7" opacity="0.3"/>
    <text x="112" y="24" fill="#7dd3fc" font-family="sans-serif" font-size="10">CFD 仿真</text>
    <rect x="195" y="10" width="85" height="20" rx="4" fill="#7c3aed" opacity="0.3"/>
    <text x="207" y="24" fill="#c4b5fd" font-family="sans-serif" font-size="10">实验验证</text>
    <rect x="290" y="10" width="85" height="20" rx="4" fill="#059669" opacity="0.3"/>
    <text x="302" y="24" fill="#6ee7b7" font-family="sans-serif" font-size="10">误差分析</text>
    <rect x="385" y="10" width="85" height="20" rx="4" fill="#db2777" opacity="0.3"/>
    <text x="397" y="24" fill="#fbcfe8" font-family="sans-serif" font-size="10">参数修正</text>
    <rect x="480" y="10" width="85" height="20" rx="4" fill="#0284c7" opacity="0.3"/>
    <text x="492" y="24" fill="#7dd3fc" font-family="sans-serif" font-size="10">迭代优化</text>
  </g>
</svg>