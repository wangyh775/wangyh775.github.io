<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Accent Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>

  <!-- Dark Background with Grid Pattern -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40"/>
    </pattern>
    <rect width="800" height="450" fill="url(#grid)"/>
  </g>

  <!-- Decorative Glowing Orbs -->
  <circle cx="150" cy="100" r="120" fill="#3b82f6" opacity="0.15" filter="url(#glow)"/>
  <circle cx="650" cy="350" r="140" fill="#8b5cf6" opacity="0.15" filter="url(#glow)"/>
  <circle cx="400" cy="220" r="80" fill="#06b6d4" opacity="0.1" filter="url(#glow)"/>

  <!-- Title & Header -->
  <text x="40" y="55" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="24" letter-spacing="0.5">
    JHTracker <tspan fill="#38bdf8" font-weight="400">| Agent-Native Architecture</tspan>
  </text>
  <text x="40" y="80" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
    AI 驱动的求职全流程管理 · 36 MCP Tools · HITL Decision Loop
  </text>

  <!-- Connecting Lines (Data Flow Pipelines) -->
  <path d="M 220 225 L 300 225" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M 500 225 L 580 225" stroke="#a78bfa" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M 400 160 L 400 290" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Flow Line Animated Nodes -->
  <circle cx="260" cy="225" r="4" fill="#38bdf8"/>
  <circle cx="540" cy="225" r="4" fill="#a78bfa"/>

  <!-- Architecture Boxes -->

  <!-- Left Box: Client / User Layer -->
  <g transform="translate(40, 140)">
    <rect width="180" height="170" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <rect width="180" height="36" rx="12" fill="#1e293b" opacity="0.8"/>
    <text x="16" y="24" fill="#38bdf8" font-family="sans-serif" font-weight="700" font-size="13">👤 User / Web Client</text>
    
    <rect x="15" y="50" width="150" height="32" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="25" y="70" fill="#e2e8f0" font-family="sans-serif" font-size="11">Flask + Tailwind UI</text>

    <rect x="15" y="90" width="150" height="32" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="25" y="110" fill="#e2e8f0" font-family="sans-serif" font-size="11">HITL 人机协同看板</text>

    <rect x="15" y="130" width="150" height="30" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="25" y="149" fill="#e2e8f0" font-family="sans-serif" font-size="11">Agent Trace 轨迹图</text>
  </g>

  <!-- Middle Core Box: Agent & MCP Engine -->
  <g transform="translate(300, 110)">
    <rect width="200" height="230" rx="12" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-width="1.5" filter="url(#glow)"/>
    <rect width="200" height="38" rx="12" fill="#2e1065" opacity="0.8"/>
    <text x="16" y="25" fill="#c084fc" font-family="sans-serif" font-weight="700" font-size="13">🧠 Agent &amp; MCP Engine</text>

    <rect x="15" y="50" width="170" height="34" rx="6" fill="#1e1b4b" stroke="#4338ca"/>
    <text x="25" y="71" fill="#a5b4fc" font-family="sans-serif" font-weight="600" font-size="11">36 MCP Tools (11 Domain)</text>

    <rect x="15" y="92" width="170" height="34" rx="6" fill="#1e1b4b" stroke="#4338ca"/>
    <text x="25" y="113" fill="#a5b4fc" font-family="sans-serif" font-weight="600" font-size="11">OpenSpec 任务执行器</text>

    <rect x="15" y="134" width="170" height="34" rx="6" fill="#1e1b4b" stroke="#4338ca"/>
    <text x="25" y="155" fill="#a5b4fc" font-family="sans-serif" font-weight="600" font-size="11">自动简历适配 &amp; 投递跟踪</text>

    <rect x="15" y="176" width="170" height="40" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="25" y="193" fill="#38bdf8" font-family="sans-serif" font-size="10">SQLAlchemy ORM</text>
    <text x="25" y="207" fill="#64748b" font-family="sans-serif" font-size="9">全流程数据模型抽象</text>
  </g>

  <!-- Right Box: Data & Storage Layer -->
  <g transform="translate(580, 140)">
    <rect width="180" height="170" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <rect width="180" height="36" rx="12" fill="#1e293b" opacity="0.8"/>
    <text x="16" y="24" fill="#38bdf8" font-family="sans-serif" font-weight="700" font-size="13">💾 Storage &amp; Data</text>

    <rect x="15" y="50" width="150" height="32" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="25" y="70" fill="#e2e8f0" font-family="sans-serif" font-size="11">SQLite 关系数据库</text>

    <rect x="15" y="90" width="150" height="32" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="25" y="110" fill="#e2e8f0" font-family="sans-serif" font-size="11">OpenSpec 变更工件</text>

    <rect x="15" y="130" width="150" height="30" rx="6" fill="#0f172a" stroke="#1e293b"/>
    <text x="25" y="149" fill="#e2e8f0" font-family="sans-serif" font-size="11">结构化 JSON 日志</text>
  </g>

  <!-- Bottom Tag Bar -->
  <g transform="translate(40, 375)">
    <rect width="720" height="40" rx="8" fill="#1e293b" stroke="#334155" opacity="0.7"/>
    <text x="20" y="25" fill="#38bdf8" font-family="sans-serif" font-weight="600" font-size="11">Tech Stack:</text>

    <rect x="100" y="10" width="60" height="20" rx="4" fill="#0284c7" opacity="0.3"/>
    <text x="114" y="24" fill="#7dd3fc" font-family="sans-serif" font-size="10">Python</text>

    <rect x="170" y="10" width="50" height="20" rx="4" fill="#0284c7" opacity="0.3"/>
    <text x="183" y="24" fill="#7dd3fc" font-family="sans-serif" font-size="10">Flask</text>

    <rect x="230" y="10" width="75" height="20" rx="4" fill="#7c3aed" opacity="0.3"/>
    <text x="240" y="24" fill="#c4b5fd" font-family="sans-serif" font-size="10">MCP Tools</text>

    <rect x="315" y="10" width="85" height="20" rx="4" fill="#7c3aed" opacity="0.3"/>
    <text x="325" y="24" fill="#c4b5fd" font-family="sans-serif" font-size="10">Agent-Native</text>

    <rect x="410" y="10" width="75" height="20" rx="4" fill="#db2777" opacity="0.3"/>
    <text x="420" y="24" fill="#fbcfe8" font-family="sans-serif" font-size="10">OpenSpec</text>

    <rect x="495" y="10" width="55" height="20" rx="4" fill="#059669" opacity="0.3"/>
    <text x="508" y="24" fill="#6ee7b7" font-family="sans-serif" font-size="10">SQLite</text>
  </g>
</svg>
