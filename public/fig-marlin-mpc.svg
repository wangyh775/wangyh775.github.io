<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40"/>
    </pattern>
    <rect width="800" height="450" fill="url(#grid)"/>
  </g>
  <circle cx="150" cy="100" r="100" fill="#3b82f6" opacity="0.12" filter="url(#glow)"/>
  <circle cx="650" cy="350" r="120" fill="#8b5cf6" opacity="0.12" filter="url(#glow)"/>

  <text x="40" y="55" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" letter-spacing="0.5">
    Marlin <tspan fill="#38bdf8" font-weight="400">MPC 温度预测控制</tspan>
  </text>
  <text x="40" y="80" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
    模型预测控制 · 前馈+反馈 · 高精度温控
  </text>

  <g transform="translate(40, 115)">
    <rect width="220" height="120" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <rect width="220" height="32" rx="10" fill="#1e293b" opacity="0.8"/>
    <text x="12" y="22" fill="#38bdf8" font-family="sans-serif" font-weight="700" font-size="12">📐 系统模型辨识</text>
    <text x="15" y="52" fill="#e2e8f0" font-family="sans-serif" font-size="10">热端热力学建模</text>
    <text x="15" y="72" fill="#94a3b8" font-family="sans-serif" font-size="9">阶跃响应参数辨识</text>
    <text x="15" y="92" fill="#64748b" font-family="sans-serif" font-size="9">状态空间模型构建</text>
  </g>
  <path d="M 260 175 L 285 175" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="272" cy="175" r="4" fill="#38bdf8"/>

  <g transform="translate(290, 115)">
    <rect width="220" height="120" rx="10" fill="url(#cardGrad)" stroke="#4338ca" stroke-width="1.5"/>
    <rect width="220" height="32" rx="10" fill="#1e1b4b" opacity="0.8"/>
    <text x="12" y="22" fill="#a5b4fc" font-family="sans-serif" font-weight="700" font-size="12">🔮 预测控制核心</text>
    <text x="15" y="52" fill="#e2e8f0" font-family="sans-serif" font-size="10">前馈 + 反馈预测</text>
    <text x="15" y="72" fill="#94a3b8" font-family="sans-serif" font-size="9">滚动优化计算</text>
    <text x="15" y="92" fill="#64748b" font-family="sans-serif" font-size="9">PWM 控制量输出</text>
  </g>
  <path d="M 510 175 L 535 175" stroke="#818cf8" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="522" cy="175" r="4" fill="#818cf8"/>

  <g transform="translate(540, 115)">
    <rect width="220" height="120" rx="10" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-width="1.5" filter="url(#glow)"/>
    <rect width="220" height="32" rx="10" fill="#2e1065" opacity="0.8"/>
    <text x="12" y="22" fill="#c084fc" font-family="sans-serif" font-weight="700" font-size="12">🎯 PID vs MPC 对比</text>
    <text x="15" y="50" fill="#e2e8f0" font-family="sans-serif" font-size="10">PID: 超调 3.2°C, 稳态 ±0.5°C</text>
    <text x="15" y="70" fill="#94a3b8" font-family="sans-serif" font-size="9">MPC: 超调 0.8°C, 稳态 ±0.2°C</text>
    <text x="15" y="90" fill="#64748b" font-family="sans-serif" font-size="9">响应速度提升 40%</text>
  </g>

  <g transform="translate(40, 280)">
    <rect width="720" height="50" rx="10" fill="url(#cardGrad)" stroke="#059669" stroke-width="1.5"/>
    <text x="20" y="30" fill="#6ee7b7" font-family="sans-serif" font-weight="700" font-size="13">✅ 优势: 显著减少超调 · 更快的温度恢复 · 高精度打印头温控</text>
  </g>

  <g transform="translate(40, 370)">
    <rect width="720" height="40" rx="8" fill="#1e293b" stroke="#334155" opacity="0.7"/>
    <text x="20" y="25" fill="#38bdf8" font-family="sans-serif" font-weight="600" font-size="11">Tech Stack:</text>
    <rect x="100" y="10" width="75" height="20" rx="4" fill="#0284c7" opacity="0.3"/>
    <text x="112" y="24" fill="#7dd3fc" font-family="sans-serif" font-size="10">Marlin</text>
    <rect x="185" y="10" width="75" height="20" rx="4" fill="#7c3aed" opacity="0.3"/>
    <text x="197" y="24" fill="#c4b5fd" font-family="sans-serif" font-size="10">MPC 算法</text>
    <rect x="270" y="10" width="85" height="20" rx="4" fill="#059669" opacity="0.3"/>
    <text x="282" y="24" fill="#6ee7b7" font-family="sans-serif" font-size="10">前馈+反馈</text>
    <rect x="365" y="10" width="85" height="20" rx="4" fill="#db2777" opacity="0.3"/>
    <text x="377" y="24" fill="#fbcfe8" font-family="sans-serif" font-size="10">模型预测</text>
    <rect x="460" y="10" width="85" height="20" rx="4" fill="#0284c7" opacity="0.3"/>
    <text x="472" y="24" fill="#7dd3fc" font-family="sans-serif" font-size="10">高精度温控</text>
  </g>
</svg>