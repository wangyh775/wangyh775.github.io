<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40"/>
    </pattern>
    <rect width="800" height="450" fill="url(#grid)"/>
  </g>
  <circle cx="150" cy="100" r="100" fill="#3b82f6" opacity="0.12" filter="url(#glow)"/>
  <circle cx="650" cy="350" r="120" fill="#8b5cf6" opacity="0.12" filter="url(#glow)"/>

  <text x="40" y="55" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" letter-spacing="0.5">
    OrcaSlicer <tspan fill="#38bdf8" font-weight="400">自定义配置与参数匹配</tspan>
  </text>
  <text x="40" y="80" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
    自定义 3D 打印机预设 · 耗材流动/热学参数调整 · 高效切片流程
  </text>

  <!-- 3 个配置阶段卡片 -->
  <g transform="translate(40, 115)">
    <rect width="220" height="120" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <rect width="220" height="32" rx="10" fill="#1e293b" opacity="0.8"/>
    <text x="12" y="22" fill="#38bdf8" font-family="sans-serif" font-weight="700" font-size="12">🖨️ 1. 打印机预设</text>
    <text x="15" y="52" fill="#e2e8f0" font-family="sans-serif" font-size="10">构建尺寸 / 喷头直径</text>
    <text x="15" y="72" fill="#94a3b8" font-family="sans-serif" font-size="9">G-code 启动/结束脚本</text>
    <text x="15" y="92" fill="#64748b" font-family="sans-serif" font-size="9">Max Volumetric Speed</text>
  </g>
  <path d="M 260 175 L 285 175" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="272" cy="175" r="4" fill="#38bdf8"/>

  <g transform="translate(290, 115)">
    <rect width="220" height="120" rx="10" fill="url(#cardGrad)" stroke="#4338ca" stroke-width="1.5"/>
    <rect width="220" height="32" rx="10" fill="#1e1b4b" opacity="0.8"/>
    <text x="12" y="22" fill="#a5b4fc" font-family="sans-serif" font-weight="700" font-size="12">🧪 2. 耗材参数配置</text>
    <text x="15" y="52" fill="#e2e8f0" font-family="sans-serif" font-size="10">熔融温度 / 喷头温度</text>
    <text x="15" y="72" fill="#94a3b8" font-family="sans-serif" font-size="9">收缩率 &amp; 流量系数</text>
    <text x="15" y="92" fill="#64748b" font-family="sans-serif" font-size="9">冷却风扇曲线设置</text>
  </g>
  <path d="M 510 175 L 535 175" stroke="#818cf8" stroke-width="2" stroke-dasharray="4 4"/>
  <circle cx="522" cy="175" r="4" fill="#818cf8"/>

  <g transform="translate(540, 115)">
    <rect width="220" height="120" rx="10" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-width="1.5" filter="url(#glow)"/>
    <rect width="220" height="32" rx="10" fill="#2e1065" opacity="0.8"/>
    <text x="12" y="22" fill="#c084fc" font-family="sans-serif" font-weight="700" font-size="12">⚙️ 3. 切片与参数导出</text>
    <text x="15" y="52" fill="#e2e8f0" font-family="sans-serif" font-size="10">层高 / 壁厚 / 填充率</text>
    <text x="15" y="72" fill="#94a3b8" font-family="sans-serif" font-size="9">打印速度 / 加速度设置</text>
    <text x="15" y="92" fill="#64748b" font-family="sans-serif" font-size="9">导出 .json/.gcode 预设</text>
  </g>

  <!-- 提示栏 -->
  <g transform="translate(40, 280)">
    <rect width="720" height="50" rx="10" fill="url(#cardGrad)" stroke="#059669" stroke-width="1.5"/>
    <text x="20" y="30" fill="#6ee7b7" font-family="sans-serif" font-weight="700" font-size="13">💡 提示: 精确的耗材参数与热端限制匹配，可显著改善成型质量与第一层粘附力</text>
  </g>

  <!-- 底部技术栈 -->
  <g transform="translate(40, 370)">
    <rect width="720" height="40" rx="8" fill="#1e293b" stroke="#334155" opacity="0.7"/>
    <text x="20" y="25" fill="#38bdf8" font-family="sans-serif" font-weight="600" font-size="11">Tech Stack:</text>
    <rect x="100" y="10" width="85" height="20" rx="4" fill="#0284c7" opacity="0.3"/>
    <text x="112" y="24" fill="#7dd3fc" font-family="sans-serif" font-size="10">OrcaSlicer</text>
    <rect x="195" y="10" width="85" height="20" rx="4" fill="#7c3aed" opacity="0.3"/>
    <text x="207" y="24" fill="#c4b5fd" font-family="sans-serif" font-size="10">JSON Config</text>
    <rect x="290" y="10" width="85" height="20" rx="4" fill="#059669" opacity="0.3"/>
    <text x="302" y="24" fill="#6ee7b7" font-family="sans-serif" font-size="10">Klipper</text>
    <rect x="385" y="10" width="85" height="20" rx="4" fill="#db2777" opacity="0.3"/>
    <text x="397" y="24" fill="#fbcfe8" font-family="sans-serif" font-size="10">PEEK/PLA/ABS</text>
    <rect x="480" y="10" width="85" height="20" rx="4" fill="#0284c7" opacity="0.3"/>
    <text x="492" y="24" fill="#7dd3fc" font-family="sans-serif" font-size="10">自定义预设</text>
  </g>
</svg>