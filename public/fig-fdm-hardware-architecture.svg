<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40"/>
    </pattern>
    <rect width="800" height="450" fill="url(#grid)"/>
  </g>
  <circle cx="150" cy="100" r="100" fill="#3b82f6" opacity="0.12" filter="url(#glow)"/>
  <circle cx="650" cy="350" r="120" fill="#8b5cf6" opacity="0.12" filter="url(#glow)"/>

  <text x="40" y="55" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="22" letter-spacing="0.5">
    大型高温FDM设备 <tspan fill="#38bdf8" font-weight="400">系统架构</tspan>
  </text>
  <text x="40" y="80" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">
    500×500×500mm 打印空间 · PEEK材料 · Linux + STM32H7 双核架构
  </text>

  <!-- 四大子系统卡片 -->
  <g transform="translate(40, 115)">
    <rect width="340" height="110" rx="10" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
    <rect width="340" height="32" rx="10" fill="#1e293b" opacity="0.8"/>
    <text x="12" y="22" fill="#38bdf8" font-family="sans-serif" font-weight="700" font-size="12">⚙️ 机械运动学子系统</text>
    <text x="15" y="52" fill="#e2e8f0" font-family="sans-serif" font-size="10">CoreXY 运动学 · 线性导轨</text>
    <text x="15" y="72" fill="#94a3b8" font-family="sans-serif" font-size="9">500mm³ 打印空间 · 精度 ±0.1mm</text>
    <text x="15" y="92" fill="#64748b" font-family="sans-serif" font-size="9">步进电机 + 闭环控制</text>
  </g>

  <g transform="translate(420, 115)">
    <rect width="340" height="110" rx="10" fill="url(#cardGrad)" stroke="#7c3aed" stroke-width="1.5" filter="url(#glow)"/>
    <rect width="340" height="32" rx="10" fill="#2e1065" opacity="0.8"/>
    <text x="12" y="22" fill="#c084fc" font-family="sans-serif" font-weight="700" font-size="12">🔥 热管理子系统</text>
    <text x="15" y="52" fill="#e2e8f0" font-family="sans-serif" font-size="10">高温热端 420°C · 加热床 150°C</text>
    <text x="15" y="72" fill="#94a3b8" font-family="sans-serif" font-size="9">MPC 温控 · PID 自整定</text>
    <text x="15" y="92" fill="#64748b" font-family="sans-serif" font-size="9">热端流道 CFD 优化 · 稳态误差 ±0.2°C</text>
  </g>

  <g transform="translate(40, 250)">
    <rect width="340" height="110" rx="10" fill="url(#cardGrad)" stroke="#059669" stroke-width="1.5"/>
    <rect width="340" height="32" rx="10" fill="#059669" opacity="0.2"/>
    <text x="12" y="22" fill="#6ee7b7" font-family="sans-serif" font-weight="700" font-size="12">⚡ 电气架构子系统</text>
    <text x="15" y="52" fill="#e2e8f0" font-family="sans-serif" font-size="10">主控 STM32H7 · 辅助核 Linux (RK3588)</text>
    <text x="15" y="72" fill="#94a3b8" font-family="sans-serif" font-size="9">24V 电源 · TMC2209 驱动</text>
    <text x="15" y="92" fill="#64748b" font-family="sans-serif" font-size="9">CAN 总线 · ESD 防护</text>
  </g>

  <g transform="translate(420, 250)">
    <rect width="340" height="110" rx="10" fill="url(#cardGrad)" stroke="#0284c7" stroke-width="1.5"/>
    <rect width="340" height="32" rx="10" fill="#0284c7" opacity="0.2"/>
    <text x="12" y="22" fill="#7dd3fc" font-family="sans-serif" font-weight="700" font-size="12">🖥️ 控制系统子系统</text>
    <text x="15" y="50" fill="#e2e8f0" font-family="sans-serif" font-size="10">Klipper 固件 · Moonraker API</text>
    <text x="15" y="70" fill="#94a3b8" font-family="sans-serif" font-size="9">G-code 解析 · 运动规划</text>
    <text x="15" y="90" fill="#64748b" font-family="sans-serif" font-size="9">Input Shaper 共振补偿 · Pressure Advance</text>
  </g>

  <!-- 底部技术栈 -->
  <g transform="translate(40, 390)">
    <rect width="720" height="40" rx="8" fill="#1e293b" stroke="#334155" opacity="0.7"/>
    <text x="20" y="25" fill="#38bdf8" font-family="sans-serif" font-weight="600" font-size="11">Tech Stack:</text>
    <rect x="100" y="10" width="85" height="20" rx="4" fill="#0284c7" opacity="0.3"/>
    <text x="112" y="24" fill="#7dd3fc" font-family="sans-serif" font-size="10">Klipper</text>
    <rect x="195" y="10" width="85" height="20" rx="4" fill="#7c3aed" opacity="0.3"/>
    <text x="207" y="24" fill="#c4b5fd" font-family="sans-serif" font-size="10">STM32H7</text>
    <rect x="290" y="10" width="85" height="20" rx="4" fill="#059669" opacity="0.3"/>
    <text x="302" y="24" fill="#6ee7b7" font-family="sans-serif" font-size="10">RK3588</text>
    <rect x="385" y="10" width="85" height="20" rx="4" fill="#db2777" opacity="0.3"/>
    <text x="397" y="24" fill="#fbcfe8" font-family="sans-serif" font-size="10">PEEK 420°C</text>
    <rect x="480" y="10" width="85" height="20" rx="4" fill="#0284c7" opacity="0.3"/>
    <text x="492" y="24" fill="#7dd3fc" font-family="sans-serif" font-size="10">MPC 控制</text>
  </g>
</svg>